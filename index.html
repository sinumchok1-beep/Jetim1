
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เจ๊ติ๋มอะไหล่ซิ่ง</title>
<style>
*{box-sizing:border-box}
:root{--navy:#163b5c;--blue:#1671c9;--blue2:#eaf4ff;--line:#e1e7ed;--bg:#f4f6f8;--text:#24313b;--muted:#74808a;--green:#14824a;--red:#d73737}
body{font-family:Arial,'Noto Sans Thai',sans-serif;background:var(--bg);margin:0;color:var(--text)}
.topbar{height:68px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 2px 10px #0002}
.brand{display:flex;align-items:center;gap:11px}.brand-icon{font-size:28px}.brand-name{font-size:20px;font-weight:800}.brand-sub{font-size:12px;opacity:.75;margin-top:2px}
.status{font-size:13px;background:#ffffff16;border:1px solid #ffffff22;padding:7px 11px;border-radius:20px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#48d487;margin-right:6px}
.app{max-width:1400px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px #0000000a}
.sale-bar{display:grid;grid-template-columns:1fr 1.2fr .9fr 190px;gap:14px;align-items:center;padding:14px 16px;margin-bottom:14px}
.sale-title{font-size:19px;font-weight:800}.sale-meta{font-size:12px;color:var(--muted);margin-top:3px}
.sale-customer{display:flex;align-items:center;gap:8px}.sale-customer label{font-size:13px;font-weight:700;white-space:nowrap}
input{height:42px;border:1px solid #ccd5dd;border-radius:8px;padding:0 12px;font-size:14px;background:#fff;width:100%}
input:focus{outline:2px solid #b9daf7;border-color:var(--blue)}
.sale-total{display:flex;justify-content:flex-end;align-items:center;gap:10px}.sale-total span{font-size:12px;color:var(--muted)}.sale-total strong{font-size:22px;color:var(--red)}
button{border:0;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px}
.checkout{height:44px;background:var(--green);color:#fff;padding:0 16px}.checkout:hover{filter:brightness(.95)}.checkout.big{width:100%;height:48px;font-size:16px}
.workspace{display:block}
.products-panel,.cart-panel,.inventory-panel{padding:16px}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.panel-head.compact{margin-bottom:10px}
.panel-head h2{font-size:18px;margin:0}.panel-head p{font-size:12px;color:var(--muted);margin:4px 0 0}
.shortcut{font-size:12px;color:var(--blue);background:var(--blue2);padding:7px 10px;border-radius:7px}
.search-wrap{display:flex;align-items:center;gap:8px;background:#f7f9fb;border:1px solid var(--line);border-radius:9px;padding:0 10px;margin-bottom:12px}.search-wrap input{border:0;background:transparent;height:46px;padding-left:2px}.search-wrap input:focus{outline:0}
.product-list{max-height:570px;overflow:auto;padding-right:2px}
.item{border:1px solid var(--line);border-radius:9px;padding:11px;margin:7px 0;background:#fff}.item:hover{border-color:#b8d5ee;background:#fbfdff}
.item b{font-size:15px}.item .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}
.item button{height:36px;background:#eaf4ff;color:#1266b1}.item button:hover{background:#dceeff}
.product-actions{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;margin-top:7px}.product-actions button{color:#fff;background:var(--blue)}.product-actions .edit{background:#ee8a18}.product-actions .danger{background:var(--red)}
.cart-panel{position:sticky;top:10px}.cart-list{min-height:150px;max-height:440px;overflow:auto}.cart-list .item{background:#f8fbff;border-color:#d9e7f3}.cart-list .item button{background:#dceeff;color:#1266b1}.bill-price{height:38px;margin:6px 0;width:160px}
.cart-footer{border-top:1px solid var(--line);margin-top:10px;padding-top:12px}.sum-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sum-row span{color:var(--muted)}.sum-row strong{font-size:25px;color:var(--red)}
.inventory-panel{margin-top:14px}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.save-product{height:42px;background:var(--blue);color:#fff}
.muted{color:var(--muted);font-size:13px}
#bill{display:none}
@media(max-width:1050px){.sale-bar{grid-template-columns:1fr 1fr}.sale-total{justify-content:flex-start}.workspace{grid-template-columns:1fr}.cart-panel{position:static}}
@media(max-width:650px){.app{padding:9px}.topbar{padding:0 13px}.status{display:none}.sale-bar{grid-template-columns:1fr;padding:12px}.sale-customer{display:block}.sale-customer label{display:block;margin-bottom:5px}.sale-total{justify-content:space-between}.checkout{width:100%}.form-grid{grid-template-columns:1fr 1fr}.product-list{max-height:none}}
@media print{@page{size:58mm auto;margin:0}body *{visibility:hidden}#bill,#bill *{visibility:visible}#bill{display:block;position:absolute;left:0;top:0;width:58mm;max-width:58mm;padding:2mm;font-size:12px;line-height:1.35;word-break:break-word}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-icon">🚗</div>
    <div>
      <div class="brand-name">เจ๊ติ๋มอะไหล่ซิ่ง</div>
      <div class="brand-sub">ระบบขายหน้าร้าน POS</div>
    </div>
  </div>
  <div class="status"><span class="dot"></span> พร้อมขาย</div>
</header>

<div class="app">

    <!-- บิล -->
    <section class="cart-panel card" style="position:static;margin-bottom:14px;">
      <div class="panel-head compact">
        <div>
          <h2>รายการในบิล</h2>
          <p>ตรวจสอบจำนวนก่อนออกบิล</p>
        </div>
      </div>
      <div id="cart" class="cart-list"></div>
      <div class="cart-footer">
        <div class="sum-row"><span>ยอดสุทธิ</span><strong id="grandTotal2">0 บาท</strong></div>
        <button class="checkout big" onclick="printBill()">🖨️ ออกบิลเงินสด</button>
      </div>
    </section>



  <section class="workspace">

    <!-- สินค้า -->
    <main class="products-panel card">
      <div class="panel-head">
        <div>
          <h2>สินค้า</h2>
          <p>ค้นหาอะไหล่แล้วเพิ่มลงบิล</p>
        </div>
        <div class="shortcut">🔎 ค้นหาเร็ว</div>
      </div>

      <div class="search-wrap">
        <span>🔍</span>
        <input id="search" placeholder="ค้นหาชื่ออะไหล่ / ยี่ห้อ / รุ่น / ปีรถ" oninput="showProducts()" autofocus>
      </div>

      <div id="products" class="product-list"></div>
    </main>

  </section>

  <!-- จัดการสินค้า -->
  <section class="card inventory-panel">
    <div class="panel-head compact">
      <div>
        <h2>⚙️ จัดการสินค้า</h2>
        <p>เพิ่มสินค้าใหม่และกำหนดต้นทุน ราคาขาย และสต็อก</p>
      </div>
    </div>
    <div class="form-grid">
      <input id="name" placeholder="ชื่ออะไหล่">
      <input id="brand" placeholder="ยี่ห้อรถ">
      <input id="model" placeholder="รุ่นรถ">
      <input id="year" placeholder="ปีรถ">
      <input id="cost" type="number" placeholder="ราคาทุน">
      <input id="price" type="number" placeholder="ราคาขาย">
      <input id="stock" type="number" placeholder="สต็อก">
      <input id="imageFile" type="file" accept="image/*" capture="environment" style="height:42px;padding:9px 12px">
      <button class="save-product" onclick="addProduct()">💾 บันทึกสินค้า</button>
    </div>
  </section>

  <div id="bill"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBxAvtwNS-cp7FQe7VNAmhVw8EkIZMqERk",
  authDomain: "jetim1.firebaseapp.com",
  projectId: "jetim1",
  storageBucket: "jetim1.firebasestorage.app",
  messagingSenderId: "292145519962",
  appId: "1:292145519962:web:d30606033e54db6d966763",
  measurementId: "G-XFYX6HE6XH"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let items = [];
let cart = [];
let ready = false;

async function initOnline(){
  try{
    await firebase.auth().signInAnonymously();
    ready = true;
    showProducts();
  }catch(err){
    console.error(err);
    alert("เชื่อมต่อฐานข้อมูลไม่ได้");
  }
}

async function save(){
  if(!ready) return;
  try{
    const batch = db.batch();
    const currentIds = new Set(items.map(p=>p.id));
    const old = await db.collection("products").get();
    old.forEach(doc=>{
      if(!currentIds.has(doc.id)) batch.delete(doc.ref);
    });
    items.forEach(p=>{
      const data = {...p};
      delete data.id;
      batch.set(db.collection("products").doc(p.id), data, {merge:true});
    });
    await batch.commit();
    showProducts();
  }catch(err){
    console.error(err);
    alert("บันทึกข้อมูลออนไลน์ไม่สำเร็จ: " + err.message);
  }
}

async function compressImage(file, maxBytes){
  if(file.size <= maxBytes) return await fileToDataURL(file);
  const bitmap = await createImageBitmap(file);
  const maxSide = 1600;
  let w = bitmap.width, h = bitmap.height;
  if(Math.max(w,h) > maxSide){
    const scale = maxSide / Math.max(w,h);
    w = Math.round(w * scale);
    h = Math.round(h * scale);
  }
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(bitmap,0,0,w,h);
  let quality = 0.85;
  let dataUrl = canvas.toDataURL("image/jpeg", quality);
  while(dataUrl.length * 0.75 > maxBytes && quality > 0.25){
    quality -= 0.05;
    dataUrl = canvas.toDataURL("image/jpeg", quality);
  }
  if(dataUrl.length * 0.75 > maxBytes){
    let scale = 0.85;
    while(dataUrl.length * 0.75 > maxBytes && scale > 0.35){
      w = Math.max(320, Math.round(w * scale));
      h = Math.max(320, Math.round(h * scale));
      canvas.width = w; canvas.height = h;
      ctx.drawImage(bitmap,0,0,w,h);
      quality = 0.7;
      dataUrl = canvas.toDataURL("image/jpeg", quality);
      scale -= 0.08;
    }
  }
  return dataUrl;
}

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function addProduct(){
  if(!ready){ alert("กำลังเชื่อมต่อฐานข้อมูล รอสักครู่"); return; }
  const n=document.getElementById("name").value.trim();
  if(!n){ alert("กรอกชื่อสินค้า"); return; }
  const ref = db.collection("products").doc();
  const imageFile = document.getElementById("imageFile").files[0];
  let image = "";
  if(imageFile){
    if(!imageFile.type.startsWith("image/")){
      alert("กรุณาเลือกไฟล์รูปภาพ");
      return;
    }
    image = await compressImage(imageFile, 900 * 1024);
  }
  const product = {
    id: ref.id,
    name:n,
    image:image || "",
    brand:document.getElementById("brand").value,
    model:document.getElementById("model").value,
    year:document.getElementById("year").value,
    cost:Number(document.getElementById("cost").value)||0,
    price:Number(document.getElementById("price").value)||0,
    stock:Number(document.getElementById("stock").value)||0,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  items.push(product);
  await save();
  document.querySelectorAll("input").forEach(i=>{
    if(i.id!=="search" && i.id!=="customer") i.value="";
  });
}

async function stock(i,v){
  items[i].stock=Math.max(0, items[i].stock+v);
  await save();
}

function normalizeText(text){
  return (text||"").toLowerCase()
    .replace(/โตโยต้า/g,"toyota")
    .replace(/วีโก้/g,"vigo")
    .replace(/อีซูซุ/g,"isuzu")
    .replace(/ฮอนด้า/g,"honda")
    .replace(/d-max/g,"dmax")
    .replace(/[^a-z0-9ก-๙]+/g,"");
}

async function showProducts(){
  if(!ready) return;
  const keyRaw = document.getElementById("search").value.trim();
  if(!keyRaw){
    document.getElementById("products").innerHTML="";
    items=[];
    return;
  }

  const words = keyRaw.toLowerCase().replace(/d-max/g,"dmax").split(/\s+/).filter(Boolean);

  const snap = await db.collection("products").limit(300).get();
  items = snap.docs.map(d=>({id:d.id,...d.data()}));

  const result = items.filter(p=>{
    const text=(p.name+" "+(p.brand||"")+" "+(p.model||"")+" "+(p.year||""))
      .toLowerCase().replace(/d-max/g,"dmax");
    return words.every(w=>text.includes(w));
  });

  let html="";
  result.forEach((p,i)=>{
    html += `<div class="item">
      ${p.image?`<img src="${p.image}" style="width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid #ddd;margin-bottom:7px">`:""}
      <b>${p.name}</b><br>
      🚘 ${p.brand||""} ${p.model||""} ปี ${p.year||""}<br>
      ต้นทุน ${p.cost} | ขาย ${p.price}<br>
      คงเหลือ ${p.stock} ชิ้น
      <div class="grid">
        <button onclick="stock(${i},1)">สต็อก +1</button>
        <button onclick="stock(${i},5)">สต็อก +5</button>
      </div>
      <div class="product-actions">
        <button onclick="addCart(${i})">➕ เพิ่มลงบิล</button>
        <button class="edit" onclick="editProduct(${i})">✏️ แก้รายละเอียด</button>
        <button class="danger" onclick="deleteProduct(${i})">🗑️ ลบสินค้า</button>
      </div>
    </div>`;
  });

  document.getElementById("products").innerHTML = html || "ไม่มีสินค้าที่ค้นหา";
}

async function editProduct(i){
  const p=items[i]; if(!p) return;
  const name=prompt("ชื่ออะไหล่",p.name||""); if(name===null) return;
  if(!name.trim()){alert("กรอกชื่อสินค้า");return;}
  const brand=prompt("ยี่ห้อรถ",p.brand||""); if(brand===null)return;
  const model=prompt("รุ่นรถ",p.model||""); if(model===null)return;
  const year=prompt("ปีรถ",p.year||""); if(year===null)return;
  const cost=Number(prompt("ราคาทุน",p.cost??0)); if(!Number.isFinite(cost)||cost<0){alert("ราคาทุนไม่ถูกต้อง");return;}
  const price=Number(prompt("ราคาขาย",p.price??0)); if(!Number.isFinite(price)||price<0){alert("ราคาขายไม่ถูกต้อง");return;}
  const stockValue=Number(prompt("จำนวนสต็อก",p.stock??0)); if(!Number.isFinite(stockValue)||stockValue<0){alert("สต็อกไม่ถูกต้อง");return;}
  Object.assign(p,{name:name.trim(),brand,model,year,cost,price,stock:stockValue});
  await save(); drawCart(); alert("แก้รายละเอียดสินค้าเรียบร้อย");
}

function deleteProduct(i){
  const p=items[i];
  if(!p) return;

  const ok=confirm(
    "ยืนยันการลบสินค้า?\n\n" +
    "สินค้า: " + p.name + "\n" +
    "ยี่ห้อ: " + (p.brand || "-") + "\n" +
    "รุ่นรถ: " + (p.model || "-") + "\n" +
    "ปีรถ: " + (p.year || "-") + "\n\n" +
    "เมื่อลบแล้ว สินค้านี้จะหายออกจากสต็อก"
  );
  if(!ok) return;

  cart = cart.filter(c => c.id !== i);
  cart.forEach(c => { if(c.id > i) c.id--; });
  items.splice(i,1);
  save();
  drawCart();
}

function addCart(i){
  if(items[i].stock<1){ alert("สต็อกไม่พอ"); return; }
  const found=cart.find(c=>c.id===i);
  if(found){ if(found.qty<items[i].stock) found.qty++; }
  else cart.push({id:i,qty:1});
  drawCart();
}

function syncPosTotal(){
  const src=document.getElementById("grandTotal");
  const dst=document.getElementById("grandTotal2");
  if(src && dst) dst.innerText=(src.innerText||"").replace(/^รวม\\s*/,"");
}

function drawCart(){
  let total=0, html="";
  cart.forEach((c,index)=>{
    const p=items[c.id];
    const unitPrice = Number(c.sellPrice ?? p.price);
    const sum = unitPrice * c.qty;
    total += sum;

    html += `<div class="item" style="border-left:5px solid #d73737;background:#f9fbff;padding:12px;border-radius:10px">
      <b style="font-size:16px;color:#163b5c">${p.name}</b><br>
      <div style="font-size:13px;line-height:1.6;margin:6px 0">
        🚘 <b>ยี่ห้อรถ:</b> ${p.brand || "-"}<br>
        🚗 <b>รุ่นรถ:</b> ${p.model || "-"}<br>
        📅 <b>ปีรถ:</b> ${p.year || "-"}<br>
        💰 <span style="color:#14824a"><b>ราคาทุน:</b> ${p.cost} บาท</span>
      </div>

      <div style="margin-top:8px">
        <span style="font-size:13px;color:#666">ราคาขายต่อชิ้น</span>
        <input class="bill-price" type="number" value="${unitPrice}"
          onchange="changeSellPrice(${index},this.value)">
      </div>

      <div style="margin:8px 0;font-weight:bold;color:#d73737">
        จำนวน ${c.qty} ชิ้น = ${sum} บาท
      </div>

      <div class="grid">
        <button onclick="qtyChange(${index},-1)">➖ ลด 1</button>
        <button onclick="qtyChange(${index},1)">➕ เพิ่ม 1</button>
      </div>
    </div>`;
  });

  document.getElementById("cart").innerHTML = html || '<div class="muted">ยังไม่มีสินค้าในบิล</div>';
  document.getElementById("grandTotal2").innerText = total + " บาท";
}

function changeSellPrice(index,value){
  cart[index].sellPrice = Number(value)||0;
  drawCart();
}

function qtyChange(i,v){
  const c=cart[i], p=items[c.id];
  if(v>0 && c.qty>=p.stock){ alert("สต็อกไม่พอ"); return; }
  c.qty+=v;
  if(c.qty<=0) cart.splice(i,1);
  drawCart();
}

async function printBill(){
  if(cart.length===0){ alert("ยังไม่มีสินค้าในบิล"); return; }
  let total=0;
  let billHTML="<center><b>บิลเงินสด</b></center><hr>";
  billHTML += new Date().toLocaleString("th-TH") + "<br>";
  const customerEl=document.getElementById("customer");
  const customer=customerEl ? customerEl.value.trim() : "";
  if(customer) billHTML += "ลูกค้า : " + customer + "<hr>";
  cart.forEach(c=>{
    const p=items[c.id], unitPrice=Number(c.sellPrice ?? p.price), sum=unitPrice*c.qty;
    total+=sum;
    p.stock=Math.max(0,p.stock-c.qty);
    billHTML += `${p.name}<br>`;
    billHTML += `รุ่นรถ : ${p.model||"-"} | ปี : ${p.year||"-"}<br>`;
    billHTML += `ราคาขาย: ${unitPrice} บาท/ชิ้น<br>`;
    billHTML += `${c.qty} × ${unitPrice} = ${sum}<br>`;
  });
  billHTML += `<hr><b>ยอดรวม ${total} บาท</b><br><center>ขอบคุณค่ะ</center>`;
  document.getElementById("bill").innerHTML=billHTML;
  document.getElementById("bill").style.display="block";
  await save();
  window.print();
  document.getElementById("bill").style.display="none";
  cart.forEach(c=>{ if(items[c.id]) delete items[c.id].billPrice; });
  cart=[];
  drawCart();
}

initOnline();
</script>
</body>
</html>
